<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSITION</title>
    <style>
*{
    margin: 0;
    padding: 0;
}
.box{
    height: 133px;
    width: 80vw;
padding: 3px;
margin: 3px;
border: 2px solid black;
}
.box1{
    /* position: absolute; */
    position: sticky;
    top: 0px;
    height: 111px;
    width: 100%;
    margin: 0;
    padding: 0;
    background-color:aqua;

}
.box2{
    position: relative;
    top: 34px;
    left: 50px;
    background-color:yellow;
}
.box3{
position: fixed;
left: 8vw;
bottom: 0px;
    background-color:red;
}
.box4{
    background-color:blue;
}
.parent{
    /* transform, filter or perspective properties can also
    make an element appear as positions*/
    transform: translate(0);
    filter: invert(0);
    perspective: 0em;
    padding: 43px;
    margin: 34px;
    border: 3px solid rgb(213, 132, 10);
    position: absolute;
}
    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1"> 1</div>
    <div class="box box2">2 </div>
    <div class="box box3"> 3</div>
    <div class="box box4"> 4</div>
    </div>
</body>
</html>
