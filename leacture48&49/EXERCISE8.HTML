<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 121px;
            height: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: animatex 3s linear infinite ,animatey 1s ease-out infinite alternate;
            /* animation: animatey 1s cubic-bezier(0.08, 0.85, 0.49, 0.32) infinite, animatex 3s linear infinite; */
        }
        .container{
position: relative;
height: 95vh;
width: 98vw;
background-color: blue;
        }
        @keyframes animatex {
            from{
                left: 0;
            }
            to{
                left: 100%;
            }
        }
        @keyframes animatey {
            form{
                bottom:0;
            }
            to{
                bottom: 100%;
            }
        }
    </style>
</head>
<body>
  <div class="container">
    <div class="box">
    </div>
  </div>  
</body>
</html>
