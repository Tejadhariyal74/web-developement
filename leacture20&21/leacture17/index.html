<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SELECTOR</title>
    <style>
        /* ELEMENT SELECTOR */
        div{
background-color: aqua;
        }

        /* CLASS SELECTOR */
.red{
background-color: blue;
}

/* ID SELECTOR */
#green{
background-color: rgb(97, 8, 8);
}

/* CHILD SELECTOR */
    /*  ye property tabhi lagai jb p direct child ho   div ka */
  div > p{   
    color: red;
    background-color: rgba(224, 11, 11, 0.426);
}
/* DESCENDANT SELECTOR.*/
  div  p{   
    color: rgb(218, 13, 13);
    background-color: rgba(191, 214, 14, 0.818);
}
/*UNIVERSAL SELECTOR.*/
*{
    margin: 0;
    padding: 0;
}
/* PSEUDO SELECTOR*/
a:visited{
    color: yellow;
}
a:link{
    color: green;
}
a:active{
    background-color: coral;
}
a:hover{
    background-color: darkslateblue;
}
p:first-child{
    background-color: yellow;
}
    </style>
</head>
<body>
    <div class="red">
        I am div.
        <!-- <article> -->
            <p>I am para inside div.</p>
        <!-- </article>         -->
    </div>
    <div>
        I am another div.
    </div>
    <div id="green">
        I am also another div.
    </div>
    <a href="https://www.google.com">GO TO GOOGLE</a>
    <a href="https://www.facebook.com">GO TO facebook</a>
</body>
<main class="one">
    <p>I am first</p>
    <p>I am second</p>
</main>
</html>
