<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS FILTERS</title>
    <style>
img1{
    filter: blur(10px);
}
img2{
    filter: brightness(101%),contract-22px;
    filter: invert(1);
    filter: opacity(0.1);
}
img3{
    /* filter: grayscale(100%); */
    filter: sepia(100%);

}
    </style>
</head>
<body>
    <div class="container">
        <img 1 src="" alt="">
        <img 2 src="" alt="">
        <img 3 src="" alt="">

    </div>
</body>
</html>
